<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback</title>
  <link rel="stylesheet" href="css/feedback.css">
  <link rel="stylesheet" href="css/index.css">
  <script src="js/feedback.js" defer></script>
</head>
<body>
   <header class="flex-element">
        <h1 id="topic">Samadhi's Portfolio</h1>

        <nav>
            <a href="./index.html" class="link">HOME</a>
            <a href="./feedback.html" class="link">FEEDBACK</a>
        </nav>
    </header>
  <main class="feedback-page">
    <a class="back-link" href="index.html">Back to portfolio</a>

    <h1>Feedback</h1>
    <p class="intro">Tell me what you think. All fields are required except the website.</p>

    <form id="feedback-form" novalidate>

      <!-- Full Name -->
      <div class="field">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          autocomplete="name"
          aria-describedby="fullName-error">
        <p class="error-message" id="fullName-error"></p>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          aria-describedby="email-error">
        <p class="error-message" id="email-error"></p>
      </div>

      <!-- Topic of Interest -->
      <div class="field">
        <label for="topic">Topic of Interest</label>
        <select id="topic" name="topic" aria-describedby="topic-error">
          <option value="">Choose a topic…</option>
          <option value="web-design">Web design</option>
          <option value="javascript">JavaScript projects</option>
          <option value="collaboration">Collaboration</option>
          <option value="other">Something else</option>
        </select>
        <p class="error-message" id="topic-error"></p>
      </div>

      <!-- Comments -->
      <div class="field">
        <label for="comments">Comments</label>
        <textarea
          id="comments"
          name="comments"
          rows="5"
          aria-describedby="comments-counter comments-error"></textarea>
        <p class="counter counter-short" id="comments-counter">0 / 15 characters minimum</p>
        <p class="error-message" id="comments-error"></p>
      </div>

      <!-- Website (optional) -->
      <div class="field">
        <label for="website">Website (optional)</label>
        <input
          type="url"
          id="website"
          name="website"
          placeholder="https://example.com"
          autocomplete="url"
          aria-describedby="website-error">
        <p class="error-message" id="website-error"></p>
      </div>

   
      <p id="form-status" role="status" ></p>

      <div class="button-row">
        <button type="submit">Submit</button>
        <button type="button" id="clear-btn">Clear</button>
      </div>

    </form>
  </main>
</body>
</html>
